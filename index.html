<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Kerem Agent - kişisel yapay zekâ asistanı">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Kerem Agent</title>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">K</div><div><b>KEREM AGENT</b><small>PERSONAL AI</small></div></div>
      <button class="new-chat" id="newChat">＋ Yeni sohbet</button>
      <div class="side-label">MENÜ</div>
      <button class="side-item active">◈　 Sohbet</button>
      <button class="side-item" id="memoryButton">▤　 Hafıza</button>
      <div class="sidebar-bottom"><span class="status-dot"></span> Arayüz hazır <small>• AI bağlantısı bekleniyor</small></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menüyü aç">☰</button>
        <div class="mobile-brand"><span class="mini-k">K</span> KEREM AGENT</div>
        <span class="version">V 1.0</span>
      </header>
      <section class="content">
        <div class="welcome" id="welcome">
          <div class="orb"><div class="orb-core">K</div></div>
          <div class="eyebrow">KİŞİSEL YAPAY ZEKÂ ASİSTANIN</div>
          <h1>Merhaba, ben <span>Kerem Agent.</span></h1>
          <p>Bugün sana nasıl yardımcı olabilirim?</p>
          <div class="suggestions">
            <button class="suggestion">💡　Bana yeni fikirler ver</button>
            <button class="suggestion">📚　Bir konuyu açıkla</button>
            <button class="suggestion">📝　Bir plan hazırlamama yardım et</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>
      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Kerem Agent'a mesaj yaz..." aria-label="Mesaj"></textarea>
          <button type="button" class="icon-btn" id="micBtn" title="Sesle yaz">🎙</button>
          <button type="submit" class="send-btn" aria-label="Gönder">➤</button>
        </form>
        <div class="disclaimer" id="status">Başlangıç sürümü · Yapay zekâ bağlantısı henüz eklenmedi</div>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
